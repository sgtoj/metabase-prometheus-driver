name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static and unit verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Atmos
        uses: cloudposse/github-action-setup-atmos@89c34b209108da66a27c8d6565d8d4b21dbdaa73 # v3.2.0
        with:
          atmos-version: 1.224.1
          install-wrapper: false
          checksum-validation: enforce
      - name: Run local verification workflow
        run: atmos workflow verify -f verify

  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mimir API contract
            command: test mimir
          - name: Prometheus API contract
            command: test prometheus
          - name: Metabase current with Mimir
            command: test metabase
          - name: Metabase legacy with Mimir
            command: test metabase-legacy
          - name: Metabase current with Prometheus
            command: test metabase-prometheus
          - name: Metabase legacy with Prometheus
            command: test metabase-legacy-prometheus
          - name: Metabase synthetic contract
            command: test metabase-synthetic
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Atmos
        uses: cloudposse/github-action-setup-atmos@89c34b209108da66a27c8d6565d8d4b21dbdaa73 # v3.2.0
        with:
          atmos-version: 1.224.1
          install-wrapper: false
          checksum-validation: enforce
      - name: Run compatibility target
        run: atmos ${{ matrix.command }}
